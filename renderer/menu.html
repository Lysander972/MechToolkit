        <BeUILabel name="content" pos="0,-120,0" parentanchor="UPPER_CENTER" anchor="UPPER_CENTER" widthextend="TO_EDGE" heightextend="TO_EDGE" size="50,50,1" color="rgba(255,255,255,255)" text="上方点赞召唤各类,玩家本体升级增加水果血量\n下方点赞装填子弹,玩家本体升级增加发射数量\n\n上方礼物召唤各类水果,高级水果有特殊效果:\n香蕉串:被摧毁后原地产生5根香蕉\n冰块:持续冰冻对方所有人,冰冻期间射速减半\n煤气罐:会爆炸,对栅栏造成强制伤害\n大西瓜:持续召唤小西瓜\n\n下方礼物召唤各类子弹,高级子弹有额外效果:\n强化子弹:提高射速,但加快弹药消耗\n飞刀:穿透效果,可以把血量较低的水果切成两半\n重炮:爆炸时造成范围伤害\n滚筒:可以解除本体的冰冻效果\n栅栏:阻挡对方水果的推进\n火力倾泻:召唤密集炮击和大火球,可造成大范围伤害和击飞\n\n关于加时:\n上方礼物增加倒计时时间\n下方礼物增加剩余距离\n总时间和距离不会超过开局数值的1.5倍" fontsize="25" alignment="UPPER_LEFT"></BeUILabel>
