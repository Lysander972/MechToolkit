name: architecture-preview

on:
  push:
    branches: [main]
    paths: ['.github/workflows/architecture.yml']
  schedule:
    # 每日同步 Toolkit main 上的架构模型（model.c4）变化
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Lysander972/Toolkit
          ref: main
          path: toolkit
      - uses: actions/configure-pages@v4
        id: pages
      - uses: likec4/actions@v1
        with:
          action: build
          path: toolkit/tools
          output: dist
          base: ${{ steps.pages.outputs.base_path }}
          likec4-version: 1.59.3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-pages
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
